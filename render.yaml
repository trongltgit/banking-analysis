services:
  - type: web
    name: banking-analysis
    runtime: docker          # ← Đổi thành docker
    dockerfilePath: Dockerfile
    buildCommand: ""         # Docker sẽ tự build
    startCommand: ""         # CMD trong Dockerfile sẽ dùng
    envVars:
      - key: GROQ_API_KEY_BK
        sync: false
      - key: PORT
        value: 10000

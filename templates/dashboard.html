<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Bank Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
body {
    margin: 0;
    font-family: Arial;
    background: #f4f6f9;
}

.header {
    background: #0a7c3b;
    color: white;
    padding: 15px;
    font-size: 20px;
    font-weight: bold;
}

.container {
    display: flex;
    height: calc(100vh - 60px);
}

.left {
    width: 35%;
    padding: 20px;
    background: #ffffff;
    overflow-y: auto;
    border-right: 1px solid #ddd;
}

.right {
    width: 65%;
    padding: 20px;
    overflow-y: auto;
}

textarea {
    width: 100%;
    height: 120px;
    padding: 10px;
}

button {
    margin-top: 10px;
    padding: 10px 20px;
    background: #0a7c3b;
    color: white;
    border: none;
    cursor: pointer;
}

.card {
    background: white;
    padding: 15px;
    margin-bottom: 15px;
    border-radius: 8px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
}

table {
    width: 100%;
    border-collapse: collapse;
}

th, td {
    padding: 10px;
    border-bottom: 1px solid #ddd;
    text-align: left;
}

.chart-box {
    background: white;
    padding: 20px;
    border-radius: 8px;
    margin-bottom: 20px;
}
</style>
</head>

<body>

<div class="header">🏦 AI Bank Dashboard</div>

<div class="container">

    <div class="left">
        <h3>Nhập URL ngân hàng</h3>
        <textarea id="urls">https://techcombank.com/
https://bidv.com.vn/
https://www.vietinbank.vn/
https://www.vietcombank.com.vn/</textarea>
        <button onclick="analyze()">Phân tích</button>

        <h3>Chiến lược AI</h3>
        <div id="strategy" class="card"></div>
    </div>

    <div class="right">
        <div class="chart-box">
            <canvas id="productChart"></canvas>
        </div>

        <div class="card">
            <h3>Bảng so sánh</h3>
            <table id="resultTable">
                <thead>
                    <tr>
                        <th>Ngân hàng</th>
                        <th>Sản phẩm</th>
                        <th>Lãi suất</th>
                        <th>Ưu đãi</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

</div>

<script>
async function analyze() {
    const urls = document.getElementById("urls").value
        .split("\n")
        .filter(u => u.trim() !== "");

    document.getElementById("strategy").innerText = "Đang phân tích...";

    const res = await fetch("/analyze", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({urls})
    });

    const data = await res.json();

    renderTable(data.results);
    renderChart(data.results);
    document.getElementById("strategy").innerText = data.strategy;
}

function renderTable(results) {
    const tbody = document.querySelector("#resultTable tbody");
    tbody.innerHTML = "";

    results.forEach(r => {
        const a = r.analysis;

        const row = `
            <tr>
                <td>${a.bank_name}</td>
                <td>${(a.products || []).join(", ")}</td>
                <td>${a.interest_rates || "-"}</td>
                <td>${(a.promotions || []).join(", ")}</td>
            </tr>
        `;

        tbody.innerHTML += row;
    });
}

function renderChart(results) {
    const labels = [];
    const data = [];

    results.forEach(r => {
        labels.push(r.analysis.bank_name);
        data.push((r.analysis.products || []).length);
    });

    const ctx = document.getElementById("productChart");

    new Chart(ctx, {
        type: "bar",
        data: {
            labels: labels,
            datasets: [{
                label: "Số lượng sản phẩm",
                data: data
            }]
        }
    });
}
</script>

</body>
</html>

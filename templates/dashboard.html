<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Bank Dashboard PRO</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
body {
    margin: 0;
    font-family: "Segoe UI", sans-serif;
    background: linear-gradient(135deg, #0a7c3b, #0f9d58);
}

.header {
    color: white;
    padding: 20px;
    font-size: 22px;
    font-weight: bold;
}

.container {
    display: flex;
    height: calc(100vh - 70px);
}

.left {
    width: 30%;
    padding: 20px;
    background: #ffffff;
    overflow-y: auto;
    border-radius: 20px 0 0 20px;
}

.right {
    width: 70%;
    padding: 20px;
    overflow-y: auto;
}

textarea {
    width: 100%;
    height: 120px;
    padding: 10px;
    border-radius: 10px;
    border: 1px solid #ccc;
}

button {
    margin-top: 10px;
    padding: 12px;
    width: 100%;
    border-radius: 10px;
    border: none;
    background: #0a7c3b;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

.card {
    background: white;
    padding: 15px;
    margin-bottom: 15px;
    border-radius: 12px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
}

.kpi {
    display: flex;
    gap: 10px;
    margin-bottom: 15px;
}

.kpi-box {
    flex: 1;
    background: white;
    padding: 15px;
    border-radius: 12px;
    text-align: center;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
}

.chart-box {
    background: white;
    padding: 20px;
    border-radius: 12px;
    margin-bottom: 20px;
}

table {
    width: 100%;
    border-collapse: collapse;
}

th, td {
    padding: 10px;
    border-bottom: 1px solid #eee;
}

tr:hover {
    background: #f9f9f9;
}
</style>
</head>

<body>

<div class="header">🏦 AI Bank Dashboard PRO</div>

<div class="container">

<div class="left">
    <h3>Nhập URL ngân hàng</h3>
    <textarea id="urls">https://techcombank.com/
https://bidv.com.vn/
https://www.vietinbank.vn/
https://www.vietcombank.com.vn/</textarea>
    <button onclick="analyze()">Phân tích</button>

    <h3>Chiến lược AI</h3>
    <div id="strategy" class="card"></div>
</div>

<div class="right">

<div class="kpi">
    <div class="kpi-box">
        <div id="totalBanks">0</div>
        <small>Ngân hàng</small>
    </div>
    <div class="kpi-box">
        <div id="topProducts">0</div>
        <small>Sản phẩm nhiều nhất</small>
    </div>
    <div class="kpi-box">
        <div id="topPromo">0</div>
        <small>Ưu đãi nhiều nhất</small>
    </div>
</div>

<div class="chart-box">
    <canvas id="barChart"></canvas>
</div>

<div class="chart-box">
    <canvas id="pieChart"></canvas>
</div>

<div class="card">
    <h3>Bảng so sánh chi tiết</h3>
    <table id="resultTable">
        <thead>
            <tr>
                <th>Ngân hàng</th>
                <th>Sản phẩm</th>
                <th>Lãi suất</th>
                <th>Ưu đãi</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
</div>

</div>

</div>

<script>
let barChart, pieChart;

async function analyze() {
    const urls = document.getElementById("urls").value.split("\n").filter(u => u);

    document.getElementById("strategy").innerText = "Đang phân tích...";

    const res = await fetch("/analyze", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({urls})
    });

    const data = await res.json();

    renderAll(data.results);
    document.getElementById("strategy").innerText = data.strategy;
}

function renderAll(results) {
    renderTable(results);
    renderCharts(results);
    renderKPI(results);
}

function renderTable(results) {
    const tbody = document.querySelector("#resultTable tbody");
    tbody.innerHTML = "";

    results.forEach(r => {
        const a = r.analysis;
        tbody.innerHTML += `
            <tr>
                <td>${a.bank_name}</td>
                <td>${(a.products||[]).join(", ")}</td>
                <td>${a.interest_rates||"-"}</td>
                <td>${(a.promotions||[]).join(", ")}</td>
            </tr>
        `;
    });
}

function renderCharts(results) {
    const labels = [];
    const productCounts = [];

    results.forEach(r => {
        labels.push(r.analysis.bank_name);
        productCounts.push((r.analysis.products||[]).length);
    });

    if (barChart) barChart.destroy();
    if (pieChart) pieChart.destroy();

    barChart = new Chart(document.getElementById("barChart"), {
        type: "bar",
        data: {
            labels: labels,
            datasets: [{ data: productCounts }]
        }
    });

    pieChart = new Chart(document.getElementById("pieChart"), {
        type: "pie",
        data: {
            labels: labels,
            datasets: [{ data: productCounts }]
        }
    });
}

function renderKPI(results) {
    document.getElementById("totalBanks").innerText = results.length;

    let maxProduct = Math.max(...results.map(r => (r.analysis.products||[]).length));
    let maxPromo = Math.max(...results.map(r => (r.analysis.promotions||[]).length));

    document.getElementById("topProducts").innerText = maxProduct;
    document.getElementById("topPromo").innerText = maxPromo;
}
</script>

</body>
</html>

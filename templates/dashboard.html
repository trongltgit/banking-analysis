<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Banking Intelligence PRO</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
    margin: 0;
    font-family: "Segoe UI", sans-serif;
    background: #0b3d2e;
}

.header {
    padding: 18px;
    color: white;
    font-size: 20px;
    font-weight: bold;
    background: #0f5e43;
}

.container {
    display: flex;
    height: calc(100vh - 60px);
}

/* LEFT */
.left {
    width: 32%;
    background: white;
    padding: 18px;
    overflow-y: auto;
}

textarea {
    width: 100%;
    height: 120px;
    padding: 10px;
    border-radius: 10px;
    border: 1px solid #ccc;
}

button {
    width: 100%;
    padding: 12px;
    margin-top: 10px;
    background: #0f5e43;
    color: white;
    border: none;
    border-radius: 10px;
    font-weight: bold;
    cursor: pointer;
}

.card {
    background: #f9f9f9;
    padding: 12px;
    margin-top: 12px;
    border-radius: 10px;
}

/* RIGHT */
.right {
    width: 68%;
    padding: 18px;
    overflow-y: auto;
}

.kpi {
    display: flex;
    gap: 10px;
}

.kpi-box {
    flex: 1;
    background: white;
    padding: 12px;
    border-radius: 10px;
    text-align: center;
}

.chart-box {
    background: white;
    padding: 12px;
    margin-top: 15px;
    border-radius: 10px;
}

table {
    width: 100%;
    margin-top: 15px;
    border-collapse: collapse;
    background: white;
}

th, td {
    padding: 10px;
    border-bottom: 1px solid #eee;
}

th {
    background: #f0f0f0;
}
</style>
</head>

<body>

<div class="header">🏦 AI BANKING INTELLIGENCE PLATFORM PRO</div>

<div class="container">

<!-- LEFT -->
<div class="left">
    <h3>Input Bank URLs</h3>

    <textarea id="urls">
https://techcombank.com/
https://bidv.com.vn/
https://www.vietinbank.vn/
https://www.vietcombank.com.vn/
    </textarea>

    <button onclick="analyze()">RUN AI ANALYSIS</button>

    <div class="card" id="strategy">
        <b>Strategy Panel</b>
    </div>
</div>

<!-- RIGHT -->
<div class="right">

<div class="kpi">
    <div class="kpi-box">
        <div id="totalBanks">0</div>
        <small>Banks</small>
    </div>

    <div class="kpi-box">
        <div id="totalProducts">0</div>
        <small>Products</small>
    </div>

    <div class="kpi-box">
        <div id="totalPromo">0</div>
        <small>Promotions</small>
    </div>
</div>

<div class="chart-box">
    <canvas id="barChart"></canvas>
</div>

<div class="chart-box">
    <canvas id="pieChart"></canvas>
</div>

<table>
<thead>
<tr>
    <th>Bank</th>
    <th>Products</th>
    <th>Rates</th>
    <th>Promotions</th>
</tr>
</thead>
<tbody id="tableBody"></tbody>
</table>

</div>
</div>

<script>

let barChart, pieChart;

async function analyze() {
    const urls = document.getElementById("urls")
        .value.split("\n")
        .map(u => u.trim())
        .filter(u => u);

    document.getElementById("strategy").innerHTML = "Running AI...";

    const res = await fetch("/analyze", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({urls})
    });

    const data = await res.json();

    render(data);
}

/* ================= RENDER ================= */

function render(data) {
    const results = data.results || [];

    renderTable(results);
    renderCharts(results);
    renderKPI(results);
    renderStrategy(data.strategy);
}

/* TABLE */
function renderTable(results) {
    const tbody = document.getElementById("tableBody");
    tbody.innerHTML = "";

    results.forEach(r => {
        const a = r.analysis || {};

        const products = (a.products || []).map(p =>
            typeof p === "string" ? p : (p.name || "")
        ).join(", ");

        tbody.innerHTML += `
        <tr>
            <td>${a.bank_name || r.url}</td>
            <td>${products}</td>
            <td>${a.interest_rates || "-"}</td>
            <td>${(a.promotions || []).join(", ")}</td>
        </tr>
        `;
    });
}

/* KPI */
function renderKPI(results) {
    document.getElementById("totalBanks").innerText = results.length;

    let totalProducts = 0;
    let totalPromo = 0;

    results.forEach(r => {
        totalProducts += (r.analysis?.products?.length || 0);
        totalPromo += (r.analysis?.promotions?.length || 0);
    });

    document.getElementById("totalProducts").innerText = totalProducts;
    document.getElementById("totalPromo").innerText = totalPromo;
}

/* CHARTS */
function renderCharts(results) {
    const labels = results.map(r => r.analysis?.bank_name || "");
    const productCounts = results.map(r => r.analysis?.products?.length || 0);

    if (barChart) barChart.destroy();
    if (pieChart) pieChart.destroy();

    barChart = new Chart(document.getElementById("barChart"), {
        type: "bar",
        data: {
            labels,
            datasets: [{
                label: "Products",
                data: productCounts
            }]
        }
    });

    pieChart = new Chart(document.getElementById("pieChart"), {
        type: "pie",
        data: {
            labels,
            datasets: [{
                data: productCounts
            }]
        }
    });
}

/* STRATEGY */
function renderStrategy(strategy) {

    let s = strategy;

    if (typeof s === "string") {
        try { s = JSON.parse(s); } catch(e) {}
    }

    document.getElementById("strategy").innerHTML = `
        <h3>🧠 AI INSIGHTS</h3>
        <ul>
            ${(s.insights || []).map(i => `<li>${i}</li>`).join("")}
        </ul>

        <h3>🚀 STRATEGY</h3>
        <ul>
            ${(s.recommendations || []).map(i => `<li>${i}</li>`).join("")}
        </ul>
    `;
}

</script>

</body>
</html>
